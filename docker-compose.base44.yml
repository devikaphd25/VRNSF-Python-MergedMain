# Base44 development compose for the UMES VR Classroom.
# Runs the Vite frontend (port 8081 → host 3000) and the Express/Socket.IO
# backend (port 3001) together in one container so the Vite proxy target
# (localhost:3001) works without app-code changes.
services:
  app:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8081"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - |
        echo "SUPABASE_URL=$$SUPABASE_URL" > .env.server
        echo "SUPABASE_SECRET_KEY=$$SUPABASE_SECRET_KEY" >> .env.server
        echo "PORT=3001" >> .env.server

        echo "VITE_SUPABASE_URL=$$VITE_SUPABASE_URL" > .env.development
        echo "VITE_SUPABASE_ANON_KEY=$$VITE_SUPABASE_ANON_KEY" >> .env.development
        echo "VITE_PROFESSOR_VERIFICATION_CODE=$$VITE_PROFESSOR_VERIFICATION_CODE" >> .env.development

        npm ci
        node --env-file=.env.server --import tsx --watch server.ts &
        exec ./node_modules/.bin/vite
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          (async () => {
            for (const [name, url, method] of [
              ['Frontend', 'http://localhost:8081/', 'GET'],
              ['Backend', 'http://localhost:3001/api/device-login', 'OPTIONS']
            ]) {
              try {
                const response = await fetch(url, { method, signal: AbortSignal.timeout(2000) });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                if (name === 'Backend' && !(await response.text()).includes('POST'))
                  throw new Error('Device login route is unavailable');
              } catch (error) {
                console.error(name + ' health check failed: ' + error.message);
                process.exitCode = 1;
              }
            }
          })();
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  node_modules:
