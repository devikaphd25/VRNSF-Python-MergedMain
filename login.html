<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      color: white;
      overflow: hidden;
    }

    /* Background Image */
    #bgImage {
      position: fixed;
      inset: 0;
      background-image: url("./images/logo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      animation: zoomInOut 8s ease-in-out infinite alternate;
      opacity: 0.5;
      z-index: 0;
    }

    /* Dark overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1;
    }

    @keyframes zoomInOut {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    /* Login Box */
    .login-box {
      position: relative;
      z-index: 2;
      width: 320px;
      padding: 30px;
      background: rgba(20,20,20,0.9);
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,188,212,0.4);
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #00bcd4;
      border: none;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0097a7;
    }

    #loading {
      display: none;
      margin-top: 10px;
      color: #00e5ff;
    }
  </style>
</head>

<body>

  <!-- Background -->
  <div id="bgImage"></div>

  <!-- Audio -->
  <audio id="loginSound" autoplay loop muted>
    <source src="./sounds/intro.mp3" type="audio/mpeg">
  </audio>

  <!-- Login UI -->
  <div class="login-box">
    <h2>UMES VR</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">ENTER</button>

    <div id="loading">Loading...</div>
  </div>

  <script>
  const sound = document.getElementById("loginSound");
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const loadingElement = document.getElementById("loading");

  // Remove an old login whenever the login page opens.
  localStorage.removeItem("vrUser");

  window.addEventListener("load", () => {
    sound.play().catch(() => {
      console.log("Autoplay blocked");
    });
  });

  document.addEventListener(
    "click",
    () => {
      sound.muted = false;
      sound.volume = 0.5;
      sound.play().catch(() => {});
    },
    { once: true }
  );

  function login() {
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();

    if (!username || !password) {
      alert("Enter username and password");
      return;
    }

    /*
     * Username "admin" becomes the instructor.
     * The check is case-insensitive:
     * admin, ADMIN, and Admin all work.
     */
    const role =
      username.toLowerCase() === "admin"
        ? "instructor"
        : "student";

    const vrUser = {
      username,
      role,
      loginTime: new Date().toISOString()
    };

    localStorage.setItem("vrUser", JSON.stringify(vrUser));

    sound.muted = false;
    sound.volume = 0.5;
    sound.play().catch(() => {});

    loadingElement.textContent =
      role === "instructor"
        ? "Loading instructor classroom..."
        : "Loading student classroom...";

    loadingElement.style.display = "block";

    setTimeout(() => {
      window.location.href = "./index.html";
    }, 1200);
  }

  // Allow Enter key to submit the login.
  usernameInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      login();
    }
  });

  passwordInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      login();
    }
  });
</script>
</body>
</html>
